<ion-app>
  <ion-footer>
    <ion-toolbar *ngIf="this.authService.usuarioLogeado.length!=0" >
    <!-- <ion-toolbar *ngIf="this.auth.currentUser?.email!=undefined" > -->
      <ion-buttons class="navigationBar" >
        <ion-button [routerLink]="'/'" routerDirection="root">
          <ion-icon name="home"></ion-icon>
        </ion-button>
        <!-- <ion-button [routerLink]="'/login'" routerDirection="root">
          <ion-icon name="person-circle-outline"></ion-icon>
        </ion-button> -->
        <ion-button  [routerLink]="'/alta'" routerDirection="root" *ngIf="this.authService.tipoUsuario">
          <ion-icon name="add-circle-outline"></ion-icon>
        </ion-button>
        <ion-button [routerLink]="'/escanear'" routerDirection="root">
          <ion-icon name="qr-code-outline"></ion-icon>
        </ion-button>
        <ion-button *ngIf="this.authService.tipoUsuario=='Dueño' || this.authService.tipoUsuario=='Supervisor'" [routerLink]="'/listaClientes'" routerDirection="root">
          <ion-icon name="person-add-outline"></ion-icon>
        </ion-button>
        <ion-button  (click)="logout()">
          <ion-icon name="log-out-outline"></ion-icon>
        </ion-button>
      </ion-buttons>
<!--       
      <ion-buttons slot="end">
        <ion-button color="light" (click)="logout()">
          <ion-icon name="log-out-outline"></ion-icon>
        </ion-button>
      </ion-buttons> -->
    </ion-toolbar>
  </ion-footer>
  <ion-content>
    <ion-router-outlet></ion-router-outlet>
  </ion-content>
</ion-app>

<!-- El splash screen personalizado -->
<app-splash-screen *ngIf="!bandera"></app-splash-screen>
