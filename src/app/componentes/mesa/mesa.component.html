<div class="container">
  <!-- Clientes -->
  <ng-container *ngIf="authService.tipoUsuario === 'Cliente'">
    <h2>Escanea el QR</h2>
    <button
      id="escanearQrMesa"
      class="botonPrincipal botonScan"
      (click)="escanearQr()"
    >
      <ion-icon name="qr-code-outline" class="iconScan"></ion-icon>
    </button>
    <!-- El estado del pedido se muestra en todos los casos -->
    <button
      class="botonPrincipal"
      (click)="navegarA('chat')"
      *ngIf="estadoActual < 4"
    >
      Ver el estado del pedido
    </button>
    <ng-container *ngIf="estadoActual < 5 && estadoActual > 1">
      <button class="botonPrincipal" (click)="navegarA('chat')">
        Ir a completar encuesta
      </button>
      <button class="botonPrincipal" (click)="navegarA('chat')">
        Ir a juegos
      </button>
    </ng-container>
    <button
      class="botonPrincipal"
      (click)="navegarA('chat')"
      *ngIf="estadoActual === 3"
    >
      Confirmar recepción del pedido
    </button>
    <button
      class="botonPrincipal"
      (click)="navegarA('chat')"
      *ngIf="estadoActual === 4"
    >
      Pedir cuenta
    </button>
  </ng-container>
</div>
