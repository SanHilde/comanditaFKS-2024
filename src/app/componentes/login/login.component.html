<ngx-spinner
  bdColor="rgba(0, 0, 0, 0.8)"
  template="<img src='./../../../assets/logoConFondo.png' alt='logo' />"
>
  <p style="color: white; font-size: 40px;">Cargando...</p>
</ngx-spinner>
<ion-content>
  <div class="container">
    <ion-title>Inicio de sesión</ion-title>

    <!-- <h2 class="text-access">Acceso rápido</h2> -->
    <div class="buttons-container">
      <button
        class="btnImagen"
        (click)="handleQuickAccess('duenio@gmail.com', '123456')"
      >
        <!-- Dueño -->
         <img src="./../../../assets/pics/duenio.png" alt="Dueño">
      </button>
      <button
        class="btnImagen"
        (click)="handleQuickAccess('supervisor@gmail.com', '123456')"
      >
        <!-- Supervisor -->
        <img src="./../../../assets/pics/supervisor.png" alt="Supervisor">
      </button>
      <button
        class="btnImagen"
        (click)="handleQuickAccess('fernando@gmail.com', '123456')"
      >
        <!-- Cliente -->
        <img src="./../../../assets/pics/cliente.png" alt="Cliente">
      </button>
      <button
        class="btnImagen"
        (click)="handleQuickAccess('cocinero@gmail.com', '123456')"
      >
        <!-- Cocinero -->
        <img src="./../../../assets/pics/cocinero.png" alt="Cocinero">
      </button>
      <button
        class="btnImagen"
        (click)="handleQuickAccess('mozo@gmail.com', '123456')"
      >
        <!-- Mozo -->
        <img src="./../../../assets/pics/mozo.png" alt="Mozo">
      </button>
      <button
      class="btnImagen"
      (click)="ingresoAnonimo()"
    >
      <!-- Anónimo -->
      <img src="./../../../assets/pics/anonimo.png" alt="Anónimo">
    </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="handleSubmit()">
      <ion-input
        color="dark"
        id="email"
        formControlName="email"
        type="email"
        label="Correo"
        placeholder="Ingrese correo"
        (input)="onInputChange()"
      />
      <br />
      <ion-input
        color="dark"
        id="password"
        formControlName="password"
        type="password"
        label="Clave"
        placeholder="Ingrese clave"
        (input)="onInputChange()"
      >
        <ion-input-password-toggle slot="end"></ion-input-password-toggle>
      </ion-input>

      <!-- <button id="button" type="submit">Iniciar sesión</button> -->
      <button class="botonPrincipal" type="submit">Iniciar sesión</button>

    </form>
  </div>
  <div *ngIf="errorMessage.length > 0">
    <ion-toast
      class="text-danger"
      color="danger"
      [duration]="5000"
      (didDismiss)="errorMessage = ''"
      isOpen="errorMessage.length > 0"
      [message]="errorMessage"
      position="bottom"
    ></ion-toast>
  </div>
</ion-content>
