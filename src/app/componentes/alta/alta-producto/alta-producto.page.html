<ion-header>
  <ion-toolbar>
    <ion-title>Registrar Producto</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="container">
  <form [formGroup]="productoForm" (ngSubmit)="onSubmit()" class="contenedorCompleto">
    <ion-item>
      <ion-label position="stacked">Nombre del Producto:</ion-label>
      <br>
      <ion-input formControlName="nombre" required></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Descripción:</ion-label>
      <br>
      <ion-textarea formControlName="descripcion" required></ion-textarea>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Tiempo de Elaboración (minutos):</ion-label>
      <br>
      <ion-input
        formControlName="tiempoElaboracion"
        type="number"
        required
      ></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Precio:</ion-label>
      <br>
      <ion-input formControlName="precio" type="number" required></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Categoría:</ion-label>
      <p>{{ productoForm.get('categoria')?.value }}</p>
    </ion-item>

    <ion-item *ngIf="productoForm.controls['categoria'].value === 'Cocinero'">
      <ion-label>¿La comida es un postre?</ion-label>
      <ion-checkbox formControlName="esPostre"></ion-checkbox>
    </ion-item>

    <ion-button expand="full" (click)="tomarFoto()" class="botonPrincipal">
      Capturar Foto
    </ion-button>

    <ion-button expand="full" type="submit" class="botonPrincipal">
      Registrar Producto
    </ion-button>
  </form>

  <div *ngIf="fotos.length > 0" class="img-container">
    <h3>Fotos del Producto:</h3>
    <div *ngFor="let foto of fotos">
      <img [src]="foto" alt="Foto del producto" />
    </div>
  </div>

  <div *ngIf="codigoQR" class="qr-container">
    <h3>Código QR del Producto:</h3>
    <img [src]="codigoQR" alt="Código QR del producto" />
  </div>
</ion-content>
