<div class="container ">
  <h1>Lista de clientes para aprobar</h1>
    <div *ngFor="let item of datosTraidos" class="card" (click)="seleccionarFila(item)">
      <img *ngIf="item['foto']" [src]="item['foto']" [alt]="item['nombre']" class="imgTabla">
      <div>
        <h2 *ngIf="item['nombre']" class="titulo w100">{{ item['nombre']}} {{ item['apellido']}}</h2>
        <!-- <p>Aprobar: </p> -->
        <div class="fila">
          <ion-fab-button color="danger" (click)="aprobacion('rechazado', item)" class="">
            <ion-icon name="close-circle-outline"></ion-icon>
          </ion-fab-button>
          <ion-fab-button color="success" (click)="aprobacion('aprobado', item)" class="">
            <ion-icon name="chevron-down-circle-outline"></ion-icon>
          </ion-fab-button>          
          <!-- <ion-toggle aria-label="Success toggle" color="success" [checked]="item['aprobado']" (ionChange)="toggleChanged($event, item)"></ion-toggle> -->
        </div>
      </div>
    </div>
    <p *ngIf="datosTraidos.length === 0">No hay datos para mostrar</p>
  </div>
